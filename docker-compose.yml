services:
  file-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST_ROOT: ${HOST_ROOT:-/home/ubuntu}
      DASHBOARD_INTERNAL_PORT: 8080
      AUTO_TRANSFER_INTERVAL_MINUTES: ${AUTO_TRANSFER_INTERVAL_MINUTES:-60}
      CLIENT_LOG_CLEANUP_DAYS: ${CLIENT_LOG_CLEANUP_DAYS:-7}
      FILE_STABILITY_SECONDS: ${FILE_STABILITY_SECONDS:-30}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      DASHBOARD_SMTP_HOST: ${DASHBOARD_SMTP_HOST:-smtp.gmail.com}
      DASHBOARD_SMTP_PORT: ${DASHBOARD_SMTP_PORT:-587}
      DASHBOARD_SMTP_USE_SSL: ${DASHBOARD_SMTP_USE_SSL:-false}
      DASHBOARD_SMTP_FROM: ${DASHBOARD_SMTP_FROM:-}
      DASHBOARD_SMTP_USERNAME: ${DASHBOARD_SMTP_USERNAME:-}
      DASHBOARD_SMTP_PASSWORD: ${DASHBOARD_SMTP_PASSWORD:-}
    volumes:
      - ${HOST_ROOT:-/home/ubuntu}:${HOST_ROOT:-/home/ubuntu}
    ports:
      - "0.0.0.0:${DASHBOARD_PORT:-8080}:8080"
    working_dir: /app
    user: "${PUID:-1000}:${PGID:-1000}"
    command: python app.py