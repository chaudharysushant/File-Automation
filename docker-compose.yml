services:
  file-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST_ROOT: ${HOST_ROOT:-/home/ubuntu}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_INTERNAL_PORT: 8080
    volumes:
      - ${HOST_ROOT:-/home/ubuntu}:${HOST_ROOT:-/home/ubuntu}
    ports:
      - "0.0.0.0:${DASHBOARD_PORT:-8080}:8080"
    working_dir: /app
    command: python app.py